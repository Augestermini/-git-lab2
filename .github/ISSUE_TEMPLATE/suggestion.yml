name: Suggestion
description: Submit a suggestion or feature request
title: "[Suggestion]: "
labels: ["enhancement"]
body:
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: What is your name?
      placeholder: ex. Liu Huanchu
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this form!

  - type: dropdown
    id: request-type
    attributes:
      label: Type of request?
      description: Select the type of your request.
      options:
        - New Feature
        - Improvement
        - Bug Fix
        - Other
      default: 0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: What is the OS which you want to suggest?
      description: Select one operating system.
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What are the details of your suggestion?
      description: Explain what do you want.
      placeholder: Feature details
    validations:
      required: true
